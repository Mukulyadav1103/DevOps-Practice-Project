<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevOps Practice Lab</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
      margin: 0;
      padding: 40px 20px;
    }
    main {
      max-width: 850px;
      margin: auto;
    }
    .card {
      background: white;
      padding: 24px;
      border-radius: 12px;
      margin-top: 20px;
      box-shadow: 0 2px 8px #00000010;
    }
    .status { color: #15803d; font-weight: bold; }
  </style>
</head>
<body>
  <main>
    <h1>DevOps Practice Lab</h1>
    <p>My personal hands-on DevOps environment</p>

    <section class="card">
      <h2>Application Status</h2>
      <p>Status: <span class="status">Running</span></p>
      <p>Environment: Development</p>
      <p>Version: 1.0.0</p>
    </section>

    <section class="card">
      <h2>Practice Modules</h2>
      <p>Git & GitHub</p>
      <p>Node.js & Express</p>
      <p>Docker & CI/CD — Coming Soon</p>
      <p>AWS Infrastructure — Coming Soon</p>
    </section>
  </main>
</body>
</html>
